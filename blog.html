<!DOCTYPE html>
<html lang="tr">
<head>
    <title data-i18n="titleBlog">Blog | rangradArt</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="rangradArt'ta üye olmadan yazı paylaşın." data-i18n-content="descriptionBlog">
    <link rel="shortcut icon" href="images/leokirmizi.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a class="site-logo" href="index.html" aria-label="rangradArt ana sayfa" data-i18n-aria-label="brandHome">
            <img src="images/leokirmizi.png" alt="">
        </a>
        <a class="site-title" href="index.html">rangradArt</a>
        <div class="language-switch" role="group" aria-label="Dil seçimi" data-i18n-aria-label="languageSelect">
            <button type="button" data-language="en" aria-pressed="false">EN</button>
            <button type="button" data-language="tr" aria-pressed="true">TR</button>
        </div>
        <nav class="navbar navbar-expand-lg" aria-label="Ana menü" data-i18n-aria-label="mainMenu">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="blog.html" aria-current="page" data-i18n="navBlog">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html" data-i18n="navShop">Alışveriş</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <div class="main-wrapper">
        <main class="content px-3 py-5">
            <div class="container">
                <section id="blog-posts" aria-labelledby="blog-posts-title">
                    <h2 id="blog-posts-title" class="mb-4" data-i18n="postsTitle">Topluluktan yazılar</h2>
                    <p id="blog-posts-status" class="blog-status" role="status" aria-live="polite" data-i18n="loadingPosts">Yazılar yükleniyor…</p>
                    <div id="blog-post-list"></div>
                </section>
                <section id="blog-submit" class="blog-submit mt-5" aria-labelledby="blog-submit-title">
                    <h2 id="blog-submit-title" class="mb-3" data-i18n="shareTitle">Yazını paylaş</h2>
                    <p data-i18n="shareDescription">Üye olmadan, yalnızca adını ve e-posta adresini bırakarak blog yazısı ya da kısa bir yazı yayımlayabilirsin. Gönderiler hemen yayımlanır; e-posta adresin herkese gösterilmez.</p>
                    <form id="blog-submit-form">
                        <div class="form-group">
                            <label for="author-name" data-i18n="authorName">Adın</label>
                            <input class="form-control" id="author-name" name="author_name" type="text" maxlength="80" autocomplete="name" required>
                        </div>
                        <div class="form-group">
                            <label for="author-email" data-i18n="authorEmail">E-posta adresin</label>
                            <input class="form-control" id="author-email" name="email" type="email" maxlength="254" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="post-title"><span data-i18n="postTitle">Başlık</span> <span class="text-muted" data-i18n="optionalForNote">(kısa yazı için isteğe bağlı)</span></label>
                            <input class="form-control" id="post-title" name="title" type="text" maxlength="120">
                        </div>
                        <div class="form-group">
                            <label for="post-content" data-i18n="postContent">Yazın</label>
                            <textarea class="form-control" id="post-content" name="content" rows="7" maxlength="20000" required></textarea>
                        </div>
                        <div class="blog-honeypot" aria-hidden="true">
                            <label for="website" data-i18n="leaveBlank">Bu alanı boş bırakın</label>
                            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                        </div>
                        <button class="btn btn-primary" id="blog-submit-button" type="submit" data-i18n="publish">Yayımla</button>
                        <p id="blog-submit-status" class="blog-status mt-3" role="status" aria-live="polite"></p>
                    </form>
                </section>
            </div>
        </main>
        <footer class="footer text-center py-2 theme-bg-dark">
            <p class="copyright" data-i18n="copyright">&copy; 2026 Tüm hakları saklıdır.</p>
        </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/i18n.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
